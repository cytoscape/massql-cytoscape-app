# Runs the build's test targets on every push to main and every PR.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Unit tests
        run: make test

      # The dialog tests build real Swing components, which needs a display; without one they skip
      # themselves and the UI goes unverified.
      - name: Full suite
        run: xvfb-run --auto-servernum make integration-test

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/test-results/
            build/reports/
          retention-days: 7
